<style>
  /* ------------------------------------------------------------------
     Nyamiko: чёрно-белая панель в духе пультов LG.
     Тема берётся из темы устройства, язык - из языка устройства;
     и то и другое можно зафиксировать вручную.
     ------------------------------------------------------------------ */
  :root[data-theme="light"]{
    --bg:#f1f1f1; --panel:#ffffff; --panel2:#fafafa; --ink:#111111; --line:#111111;
    --sep:#d9d9d9; --muted:#6b6b6b; --fill:#e9e9e9; --ok:#1ec15f; --bad:#d63b3b;
    --halo:rgba(17,17,17,.13); --veil:rgba(241,241,241,.88); --shadow:none;
  }
  :root[data-theme="dark"]{
    --bg:#0e0e0e; --panel:#161616; --panel2:#1c1c1c; --ink:#f4f4f4; --line:#8f8f8f;
    --sep:#333333; --muted:#9a9a9a; --fill:#242424; --ok:#39d97a; --bad:#ff6b6b;
    --halo:rgba(244,244,244,.16); --veil:rgba(14,14,14,.9); --shadow:none;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; height:100vh; overflow:hidden;
    background:var(--bg); color:var(--ink);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  h1,h2,h3{margin:0;font-weight:600}
  .up{text-transform:uppercase;letter-spacing:.09em}
  .muted{color:var(--muted)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--sep);border-radius:0}

  .wrap{height:100vh;display:flex;flex-direction:column;padding:20px 24px 16px;gap:14px}

  /* ---------------- шапка ---------------- */
  header{display:flex;align-items:center;gap:18px;flex:0 0 auto;padding-bottom:12px;border-bottom:1px solid var(--sep)}
  .logo{width:44px;height:44px;border:1px solid var(--line);display:block;object-fit:cover}
  .title{display:flex;flex-direction:column;gap:2px}
  .title .name{font-size:26px;letter-spacing:.12em;font-weight:600;text-transform:uppercase}
  .title .sub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
  .spacer{flex:1}
  .status{display:flex;align-items:center;gap:9px;font-size:13px;text-transform:uppercase;letter-spacing:.1em}
  .status .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:block}
  .status.on .dot{background:var(--ok);animation:pulse 2.4s ease-in-out infinite}
  .status.err .dot{background:var(--bad);animation:pulse 1s ease-in-out infinite}
  .status.err{color:var(--bad)}
  .exit{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;text-align:right}
  .exit b{color:var(--ink);font-weight:600;letter-spacing:.02em}
  .hbtns{display:flex;gap:8px}

  /* ---------------- сетка ---------------- */
  main{flex:1 1 auto;display:grid;grid-template-columns:minmax(340px,0.82fr) minmax(420px,1.18fr);gap:18px;min-height:0}
  .col{display:flex;flex-direction:column;gap:14px;min-height:0}
  .block{display:flex;flex-direction:column;gap:10px;min-height:0}
  .block > h2{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;
              padding-bottom:7px;border-bottom:1px solid var(--sep);font-weight:600}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

  /* ---------------- кнопки-плитки ---------------- */
  .tile{
    position:relative;text-align:left;cursor:pointer;font:inherit;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:2px;
    padding:11px 13px;display:flex;flex-direction:column;gap:3px;
    transition:background .16s ease,color .16s ease,transform .14s ease,border-color .16s ease;
  }
  .tile .t{font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:600}
  .tile .d{font-size:12px;color:var(--muted);letter-spacing:.02em}
  .tile:hover{background:var(--fill)}
  .tile.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .tile.sel .d{color:var(--bg);opacity:.75}
  .tile.sel::after{content:"";position:absolute;right:9px;top:9px;width:6px;height:6px;background:var(--ok);border-radius:50%}
  .tile:disabled{opacity:.45;cursor:default}
  .tile.small{padding:8px 11px;flex-direction:row;align-items:center;gap:8px}
  .tile.small .t{font-size:11px}
  .focused{outline:3px solid var(--ink);outline-offset:2px;transform:translateY(-1px);
           box-shadow:0 0 0 6px var(--halo)}

  /* ---------------- узлы ---------------- */
  .nodes-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
              padding-bottom:7px;border-bottom:1px solid var(--sep)}
  .nodes-head h2{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-weight:600}
  .chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:2px;
        padding:6px 11px;font:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;
        transition:background .16s ease,color .16s ease}
  .chip:hover{background:var(--fill)}
  .chip.sel{background:var(--ink);color:var(--bg)}
  .search{flex:1 1 150px;min-width:110px;font:inherit;font-size:13px;padding:7px 10px;border-radius:2px;
          border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .nodes-wrap{flex:1 1 auto;overflow:auto;min-height:0}
  .node{
    display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;width:100%;
    text-align:left;cursor:pointer;font:inherit;color:var(--ink);
    background:transparent;border:0;border-bottom:1px solid var(--sep);
    padding:10px 8px 10px 10px;position:relative;
    transition:background .16s ease,padding-left .18s ease;
  }
  .node:hover{background:var(--fill)}
  .node > span:first-child{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 auto}
  .node .nm{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node .meta2{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node .right{display:flex;align-items:center;gap:10px}
  .bar{width:70px;height:5px;background:var(--fill);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .55s cubic-bezier(.2,.8,.2,1)}
  .ms{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;min-width:64px;text-align:right}
  .ms.good{color:var(--ok)} .ms.mid{color:var(--ink)} .ms.bad{color:var(--bad)} .ms.none{color:var(--muted);font-weight:400}
  .node.now{background:var(--fill)}
  .node.now::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ink)}
  .node.now .nm{font-weight:600}
  .node.auto .nm{text-transform:uppercase;letter-spacing:.08em;font-size:13px}
  .tag{font-size:10px;text-transform:uppercase;letter-spacing:.1em;border:1px solid var(--line);padding:2px 6px}
  .progress{height:4px;background:var(--fill);overflow:hidden;margin-bottom:10px}
  .progress i{display:block;height:100%;width:0;background:
      repeating-linear-gradient(90deg,var(--ink) 0 14px,transparent 14px 22px);
      background-size:200px 100%;animation:shimmer 1.1s linear infinite}
  .progress:not(.on){display:none}
  .hint{font-size:12px;color:var(--muted);padding-top:8px;border-top:1px solid var(--sep);line-height:1.5}

  /* ---------------- оверлеи ---------------- */
  .overlay{position:fixed;inset:0;z-index:5;background:var(--veil);
           backdrop-filter:blur(2px);display:none;padding:26px}
  .overlay.on{display:flex;flex-direction:column;gap:14px;animation:fade .16s ease-out}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:18px 20px;
         display:flex;flex-direction:column;gap:12px;min-height:0;flex:1 1 auto;animation:rise .2s ease-out}
  .sheet h2{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;
            padding-bottom:7px;border-bottom:1px solid var(--sep)}
  .sheet pre{margin:0;flex:1 1 auto;overflow:auto;font-size:12px;white-space:pre-wrap;
             font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
  input:not([type]){font:inherit;font-size:14px;padding:9px 11px;border-radius:2px;border:1px solid var(--line);
        background:var(--panel);color:var(--ink);width:100%}
  label.lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);
            text-transform:uppercase;letter-spacing:.08em}
  .footer{flex:0 0 auto;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);
          text-transform:uppercase;letter-spacing:.1em;padding-top:8px;border-top:1px solid var(--sep)}

  /* ---------------- анимации ---------------- */
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
  @keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes rowIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .node{animation:rowIn .18s ease-out both}
  .node:nth-child(n+12){animation-duration:.1s}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important}
  }

  /* ---------------- адаптив ---------------- */
  @media (max-width:1500px){ .title .sub{display:none} }
  @media (max-width:1150px){
    body{overflow:auto}
    .wrap{height:auto;min-height:100vh}
    main{grid-template-columns:1fr;min-height:0}
    .nodes-wrap{max-height:58vh}
  }
  @media (max-width:700px){
    .wrap{padding:14px 14px 18px;gap:12px}

    <div class="title">
      <div class="name">Nyamiko</div>
      <div class="sub" data-i18n="brandSuffix">VPN для телевизора</div>
    </div>
    <div class="spacer"></div>
    <div class="status" id="statusLine"><span class="dot"></span><span id="statusText">…</span></div>
    <div class="exit"><span data-i18n="exitLabel">выход:</span> <b id="exitIp">—</b><div id="bestLine"></div></div>
    <div class="hbtns">
      <button class="tile small" id="btnLang"><span class="t">🌐</span><span class="t" id="langLabel">Русский</span></button>
      <button class="tile small" id="btnTheme"><span class="t">◐</span><span class="t" id="themeLabel">Авто</span></button>
    </div>
  </header>

  <main>
    <div class="col">
      <div class="block">
        <h2 data-i18n="modeTitle">Режим</h2>
        <div class="grid2">
          <button class="tile mode" data-mode="normal"><span class="t" data-i18n="modeNormal">Обычный VPN</span><span class="d" data-i18n="modeNormalSub">весь трафик через сервер</span></button>
          <button class="tile mode" data-mode="whitelist"><span class="t" data-i18n="modeWl">Обход белых списков</span><span class="d" data-i18n="modeWlSub">сервер-обход и DNS в туннель</span></button>
        </div>
        <div class="grid2">
          <button class="tile" id="btnStart"><span class="t" data-i18n="start">Включить</span><span class="d" data-i18n="startSub">поднять туннель</span></button>
          <button class="tile" id="btnStop"><span class="t" data-i18n="stop">Выключить</span><span class="d" data-i18n="stopSub">вернуть обычный интернет</span></button>
        </div>
      </div>

      <div class="block">
        <h2 data-i18n="ctlTitle">Управление</h2>
        <div class="grid2">
          <button class="tile" id="btnAuto"><span class="t" data-i18n="auto">Авто</span><span class="d" data-i18n="autoSub">лучший узел по замеру</span></button>
          <button class="tile" id="btnPing"><span class="t" data-i18n="ping">Проверить узлы</span><span class="d" data-i18n="pingSub">задержка до всех</span></button>
          <button class="tile" id="btnFailover"><span class="t" data-i18n="failover">Пересесть</span><span class="d" data-i18n="failoverSub">сменить узел сейчас</span></button>
          <button class="tile" id="btnAutostart"><span class="t" data-i18n="autostart">Автозапуск</span><span class="d" data-i18n="autostartSub">при включении ТВ</span></button>
          <button class="tile" id="btnLog"><span class="t" data-i18n="log">Лог</span><span class="d" data-i18n="logSub">что делает клиент</span></button>
          <button class="tile" id="btnSubs"><span class="t" data-i18n="subs">Подписки</span><span class="d" data-i18n="subsSub">ключи доступа</span></button>
          <button class="tile" id="btnUpdate"><span class="t" data-i18n="update">Обновить</span><span class="d" data-i18n="updateSub">проверить новую версию</span></button>
          <button class="tile" id="btnDiag"><span class="t" data-i18n="diag">Диагностика</span><span class="d" data-i18n="diagSub">файл для сообщения об ошибке</span></button>
          <button class="tile" id="btnRescue"><span class="t" data-i18n="rescue">Аварийный сброс</span><span class="d" data-i18n="rescueSub">просто интернет</span></button>
        </div>
        <div class="hint" id="statusHint">—</div>
      </div>
    </div>

    <div class="col">
      <div class="block" style="flex:1 1 auto">
        <div class="nodes-head">
          <h2 data-i18n="nodesTitle">Узлы</h2>
          <span class="muted" id="nodeCount" style="font-size:12px"></span>
          <div class="chips">
            <input class="search" id="search" data-i18n-ph="searchPh" placeholder="поиск…">
            <button class="chip" id="chipSort" data-i18n="sortSpeed">⇅ по скорости</button>
            <button class="chip" id="chipRefresh">⟳</button>
          </div>
        </div>
        <div class="progress" id="progress"><i></i></div>
        <div class="nodes-wrap" id="nodes"></div>
      </div>
    </div>
  </main>

  <div class="footer">
    <span id="footerLeft">Nyamiko v0.5.2</span>
    <span id="footerRight">LAN</span>
  </div>
</div>

<div class="overlay" id="logOverlay">
  <div class="sheet">
    <div style="display:flex;align-items:center;gap:12px">
      <h2 style="flex:1" data-i18n="logTitle">Лог клиента</h2>
      <button class="chip" id="btnReloadLog" data-i18n="refresh">обновить</button>
    </div>
    <pre id="logText">…</pre>
    <button class="tile" id="btnCloseLog" style="align-self:flex-start"><span class="t">← <span data-i18n="back">Назад</span></span></button>
  </div>
</div>

<div class="overlay" id="subsOverlay">
  <div class="sheet" style="flex:0 0 auto">
    <h2 data-i18n="subs">Подписки</h2>
    <label class="lbl"><span data-i18n="modeNormal">Обычный VPN</span> <span id="subNormalState"></span></label>
    <input id="subNormal" data-i18n-ph="subPh" placeholder="вставьте новую ссылку">
    <label class="lbl"><span data-i18n="modeWl">Обход белых списков</span> <span id="subWhitelistState"></span></label>
    <input id="subWhitelist" data-i18n-ph="subPh" placeholder="вставьте новую ссылку">
    <div class="grid2" style="margin-top:4px">
      <button class="tile" id="btnSaveSubs"><span class="t" data-i18n="save">Сохранить</span><span class="d" data-i18n="saveSub">профиль обновится сам</span></button>
      <button class="tile" id="btnCloseSubs"><span class="t">← <span data-i18n="back">Назад</span></span><span class="d" data-i18n="noChanges">без изменений</span></button>
    </div>
    <div class="hint" data-i18n="subsHint">Ссылки хранятся только на телевизоре и в панель не уходят.</div>
  </div>
</div>

<div class="overlay" id="diagOverlay">
  <div class="sheet">
    <div style="display:flex;align-items:center;gap:12px">
      <h2 style="flex:1" data-i18n="diagTitle">Диагностика</h2>
      <a class="chip" id="diagLink" href="/api/diag" download="nyamiko-diag.txt" data-i18n="diagSave">скачать</a>
    </div>
    <pre id="diagText">…</pre>
    <div class="hint" data-i18n="diagHint">Можно открыть эту панель с телефона в той же сети и скопировать текст.</div>
    <button class="tile" id="btnCloseDiag" style="align-self:flex-start"><span class="t">← <span data-i18n="back">Назад</span></span></button>
  </div>
</div>

<div class="overlay" id="langOverlay">
  <div class="sheet" style="flex:0 0 auto;max-width:560px">
    <h2 data-i18n="langTitle">Язык интерфейса</h2>
    <div class="block" id="langList" style="gap:8px">
      <button class="tile lang" data-lang="auto"><span class="t" data-i18n="langAuto">Авто (как в системе)</span><span class="d" id="langAutoValue"></span></button>
      <button class="tile lang" data-lang="ru"><span class="t">Русский</span></button>
      <button class="tile lang" data-lang="en"><span class="t">English</span></button>
      <button class="tile lang" data-lang="uk"><span class="t">Українська</span></button>
      <button class="tile lang" data-lang="be"><span class="t">Беларуская</span></button>
    </div>
    <button class="tile" id="btnCloseLang" style="align-self:flex-start"><span class="t">← <span data-i18n="back">Назад</span></span></button>
  </div>
</div>

  get:function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set:function(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
function deviceLang(){
  var n = String(navigator.language || navigator.userLanguage || 'ru').slice(0,2).toLowerCase();
  return SUPPORTED.indexOf(n) >= 0 ? n : 'ru';
}

var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function deviceTheme(){ return (mq && mq.matches) ? 'dark' : 'light'; }
function themeMode(){ return LS.get('nyamiko.theme') || 'auto'; }   // auto | dark | light
function applyTheme(){
  var mode = themeMode();
  var th = (mode === 'auto') ? deviceTheme() : mode;
  document.documentElement.setAttribute('data-theme', th);
  el('themeLabel').textContent = t(mode === 'auto' ? 'themeAuto' : (th === 'dark' ? 'themeDark' : 'themeLight'));
  el('footerRight').textContent = (mode === 'auto') ? (th === 'dark' ? 'AUTO · DARK' : 'AUTO · LIGHT')
                                                     : (th === 'dark' ? 'DARK' : 'LIGHT');
}
function cycleTheme(){
  var order = ['auto','dark','light'];
  var cur = themeMode();
  var next = order[(order.indexOf(cur) + 1) % order.length];
  LS.set('nyamiko.theme', next);
  applyTheme();
}
if (mq){
  var onScheme = function(){ if (themeMode() === 'auto') { applyTheme(); renderStatus(); } };
  if (mq.addEventListener) mq.addEventListener('change', onScheme);
  else if (mq.addListener) mq.addListener(onScheme);
}
window.addEventListener('languagechange', function(){
  if (!LS.get('nyamiko.lang')) { LANG = deviceLang(); applyLang(); }
});

var S = { status:{}, nodes:[], delays:{}, proxies:{}, dropped:{}, mode:'normal', node:0, auto:false,
          autostart:false, sweeping:false, sortBySpeed:false, filter:'' };
var DEMO = location.search.indexOf('demo=1') >= 0;
var K = (location.search.match(/[?&]k=([^&]+)/) || [])[1] || '';
function withK(p){ return p + (p.indexOf('?') >= 0 ? '&' : '?') + 'k=' + K; }
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

/* ==================================================================
   Отрисовка
   ================================================================== */
function fmtMs(ms){
  if (ms === null || ms === undefined) return '<span class="ms none">' + t('idle') + '</span>';
  if (ms === 0) return '<span class="ms none">✕</span>';
  var cls = ms < 120 ? 'good' : (ms < 260 ? 'mid' : 'bad');
  return '<span class="ms '+cls+'">'+ms+' '+t('ms')+'</span>';
}
function barFor(ms){
  if (!ms || ms <= 0) return '<span class="bar"><i style="width:3%"></i></span>';
  var w = Math.max(5, Math.min(100, Math.round(100 - (ms / 400) * 100)));
  var col = ms < 120 ? 'var(--ok)' : (ms < 260 ? 'var(--ink)' : 'var(--bad)');
  return '<span class="bar"><i style="width:'+w+'%;background:'+col+'"></i></span>';
}
function fmtDate(sec){
  try { return new Date(sec * 1000).toLocaleString(LOCALES[LANG] || 'ru-RU',
      { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }); }
  catch(e){ return String(sec); }
}

function renderStatus(){
  var st = S.status || {}, up = st.state === 'up';
  var line = el('statusLine');
  line.className = 'status ' + (st.error ? 'err' : (up ? 'on' : ''));
  el('statusText').textContent = st.error ? (t('errorPrefix') + st.error)
      : (up ? (t('connected') + ' · ' + (S.mode === 'whitelist' ? t('modeWlShort') : t('modeNormalShort'))) : t('off'));
  var modes = document.querySelectorAll('.mode');
  for (var i=0;i<modes.length;i++) modes[i].classList.toggle('sel', modes[i].getAttribute('data-mode') === S.mode);
  el('btnAuto').classList.toggle('sel', !!S.auto);
  el('btnAutostart').classList.toggle('sel', !!S.autostart);
  el('subNormalState').textContent = st.sub_normal_set ? t('saved') : t('notSet');
  el('subWhitelistState').textContent = st.sub_whitelist_set ? t('saved') : t('notSet');
  var bm = S.delays['best'];
  el('bestLine').textContent = S.auto ? ('auto' + (bm ? ' · ' + bm + ' ' + t('ms') : ''))
      : (st.best_ms ? 'auto · ' + st.best_ms + ' ' + t('ms') : '');
  var subTxt = st.sub_updated ? (t('subUpdated') + ' ' + fmtDate(st.sub_updated)) : t('subNever');
  var sup = st.sup || {};
  var supTxt = S.auto ? (' · ' + t('autoSwitches') + ' ' + (sup.switches || 0) + (sup.note ? ' · ' + sup.note : '')) : '';
  el('statusHint').textContent = st.error ? (t('lastError') + st.error)
      : (up ? (t('core') + ' ' + (st.core || '—') + ', ' + t('iface') + ' ' + (st.tun || '—') + ' · ' + subTxt + supTxt)
            : (t('tunnelDown') + ' · ' + subTxt));
}

function renderNodes(){
  var list = S.nodes.slice();
  if (S.filter){
    var q = S.filter.toLowerCase();
    list = list.filter(function(n){ return (n.name || '').toLowerCase().indexOf(q) >= 0
        || (n.server || '').toLowerCase().indexOf(q) >= 0 || (n.type || '').toLowerCase().indexOf(q) >= 0; });
  }
  if (S.sortBySpeed){
    list.sort(function(a,b){
      var f = function(v){ return (v === null || v === undefined || v === 0) ? 1e9 : v; };
      return f(S.delays[a.tag]) - f(S.delays[b.tag]);
    });
  }
  var nowTag = S.auto ? 'auto' : ('n' + S.node);
  var html = '<button class="node auto' + (nowTag === 'auto' ? ' now' : '') + '" data-tag="auto">' +
    '<span><span class="nm">' + t('autoRow') + '</span><span class="meta2">' + t(S.auto ? 'autoOn' : 'autoOff') + '</span></span>' +
    '<span class="right">' + (nowTag === 'auto' && S.delays['best'] ? fmtMs(S.delays['best']) : ('<span class="ms none">' + t('idle') + '</span>')) + '</span></button>';
  for (var i=0;i<list.length;i++){
    var n = list[i], ms = S.delays[n.tag];
    if ((ms === null || ms === undefined) && S.proxies[n.tag]) ms = S.proxies[n.tag].delay;
    html += '<button class="node' + (n.tag === nowTag ? ' now' : '') + '" data-tag="' + n.tag + '">' +
      '<span><span class="nm">' + esc(n.name || n.server) + '</span>' +
      '<span class="meta2">' + esc(String(n.type||'').toUpperCase()) + ' · ' + esc(n.server) + ':' + n.port + '</span></span>' +
      '<span class="right">' + (n.tag === nowTag ? '<span class="tag">' + t('selected') + '</span>' : '') + barFor(ms) + fmtMs(ms) + '</span></button>';
  }
  el('nodes').innerHTML = html;
  var cnt = list.length + ' ' + t('ofNodes') + ' ' + S.nodes.length;
  var skipped = 0, reason = '';
  for (var k in (S.dropped || {})){
    if (!Object.prototype.hasOwnProperty.call(S.dropped, k)) continue;
    skipped += S.dropped[k];
    if (!reason && S.dropped[k]) reason = String(k).replace('network:', '');
  }
  if (skipped > 0) cnt += ' · ' + t('skipped') + ' ' + skipped +
      (reason ? ' (' + reason + ')' : '');
  el('nodeCount').textContent = cnt;
}

/* ==================================================================
   API
   ================================================================== */
function api(path, body, cb){
  if (DEMO) return demoApi(path, body, cb);
  var xhr = new XMLHttpRequest();
  xhr.open(body ? 'POST' : 'GET', withK(path), true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.onload = function(){ var o=null; try{o=JSON.parse(xhr.responseText);}catch(e){o=null;} cb(o); };
  xhr.onerror = function(){ cb(null); };
  xhr.send(body ? JSON.stringify(body) : null);
}
function loadStatus(cb){
  api('/api/status', null, function(st){
    if (st){ S.status = st; S.mode = st.mode_setting || S.mode;
      if (st.node_setting !== undefined && st.node_setting !== null) S.node = st.node_setting;
      S.auto = !!st.auto; if (st.best_ms) S.delays['best'] = st.best_ms; S.autostart = !!st.autostart; }
    renderStatus(); if (cb) cb();
  });
}
function loadNodes(cb){
  api('/api/nodes?mode=' + encodeURIComponent(S.mode), null, function(o){
    if (o && o.nodes && o.nodes.length) S.nodes = o.nodes;
    if (o && o.dropped) S.dropped = o.dropped;
    renderNodes(); if (cb) cb();
  });
}
function loadProxies(cb){
  api('/api/proxies', null, function(o){
    if (o && o.proxies){
      S.proxies = o.proxies;
      var sel = o.proxies['vpn'] && o.proxies['vpn'].now;
      if (sel && /^n[0-9]+$/.test(sel)) S.node = parseInt(sel.slice(1), 10);
      for (var tg in o.proxies){ if (!S.delays[tg] && o.proxies[tg].delay) S.delays[tg] = o.proxies[tg].delay; }
    }
    renderStatus(); renderNodes(); if (cb) cb();
  });
}
function loadExitIp(){ api('/api/exitip', null, function(o){ if (o && o.ip) el('exitIp').textContent = o.ip; }); }
function pollSweep(){
  api('/api/ping', null, function(o){
    if (!o || !o.sweep) return;
    var s = o.sweep, bar = el('progress');
    S.delays = s.results || S.delays;
    if (s.running){
      S.sweeping = true; bar.classList.add('on');
      bar.firstChild.style.width = Math.round(100 * s.done / Math.max(1, s.total)) + '%';
      renderNodes(); setTimeout(pollSweep, 1200);
    } else { S.sweeping = false; bar.classList.remove('on'); loadStatus(function(){ renderNodes(); }); }
  });
}

  api('/api/status', null, function(st){ if (st && st.state === 'up') startTunnel(); });
}

  el('btnStart').disabled = true;
  api('/api/start', { mode:S.mode, node:S.node }, function(){
    el('btnStart').disabled = false;
    loadStatus(function(){ loadProxies(); setTimeout(loadExitIp, 2500); });
  });
}

var updateArmed = false, updateTimer = null;
function updatePress(){
  var btn = el('btnUpdate'), label = btn.querySelector('.d');
  if (updateArmed){
    updateArmed = false;
    label.textContent = t('updStarted');
    api('/api/self-update', {}, function(o){
      if (o && o.ok){ window.setTimeout(function(){ location.reload(); }, 25000); }
      else label.textContent = (o && o.error) || t('updNoNet');
    });
    return;
  }
  label.textContent = t('updChecking');
  var xhr = new XMLHttpRequest(); xhr.open('GET', withK('/api/update-check'), true);
  xhr.onload = function(){
    var o = {};
    try { o = JSON.parse(xhr.responseText); } catch (e) { o = {}; }
    if (!o.latest){ label.textContent = t('updNoNet'); return; }
    if (!o.newer){ label.textContent = t('updLatest') + ' v' + o.current; return; }
    updateArmed = true;
    label.textContent = t('updAvail').replace('{v}', 'v' + o.latest);
    window.clearTimeout(updateTimer);
    updateTimer = window.setTimeout(function(){ updateArmed = false; label.textContent = t('updateSub'); }, 12000);
  };
  xhr.onerror = function(){ label.textContent = t('updNoNet'); };
  xhr.send();
}

/* ==================================================================
   Пульт: стрелки, OK, BACK
   ================================================================== */
function focusables(){
  var all = document.querySelectorAll('button, input, [tabindex]'), out = [];
  for (var i=0;i<all.length;i++){
    var e = all[i];
    if (e.disabled) continue;
    var r = e.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) continue;
    var st = window.getComputedStyle(e);
    if (st.display === 'none' || st.visibility === 'hidden' || st.opacity === '0') continue;
    out.push(e);
  }
  return out;
}
function focusEl(e){
  if (!e) return;
  var p = document.querySelector('.focused'); if (p) p.classList.remove('focused');
  e.classList.add('focused');
  try { e.focus(); } catch(err){}
  if (e.scrollIntoView) e.scrollIntoView({ block:'nearest', behavior:'smooth' });
}
function focusFirst(){ var l = focusables(); if (l.length) focusEl(l[0]); }
function move(dir){
  var list = focusables(); if (!list.length) return;
  var cur = document.querySelector('.focused') || list[0];
  var cr = cur.getBoundingClientRect(), cx = cr.left + cr.width/2, cy = cr.top + cr.height/2;
  var best = null, bestScore = 1e9;
  for (var i=0;i<list.length;i++){
    var e = list[i]; if (e === cur) continue;
    var r = e.getBoundingClientRect();
    var dx = (r.left + r.width/2) - cx, dy = (r.top + r.height/2) - cy;
    var ok = (dir === 'left' && dx < -8) || (dir === 'right' && dx > 8) ||
             (dir === 'up' && dy < -8) || (dir === 'down' && dy > 8);
    if (!ok) continue;
    var vertical = (dir === 'up' || dir === 'down');
    var score = (vertical ? Math.abs(dy) : Math.abs(dx)) + (vertical ? Math.abs(dx) : Math.abs(dy)) * 2.2;
    if (score < bestScore){ bestScore = score; best = e; }
  }
  if (best) focusEl(best);
}
document.addEventListener('keydown', function(ev){
  var k = ev.keyCode;
  if (k === 37 || k === 38 || k === 39 || k === 40){ ev.preventDefault(); move(k===37?'left':k===38?'up':k===39?'right':'down'); return; }
  if (k === 13){ ev.preventDefault(); var f = document.querySelector('.focused'); if (f && f.click && f.tagName !== 'INPUT') f.click(); return; }
  if (k === 461 || k === 27){
    ev.preventDefault();
    if (el('diagOverlay').classList.contains('on')){ el('diagOverlay').classList.remove('on'); focusEl(el('btnDiag')); }
    else if (el('logOverlay').classList.contains('on')){ el('logOverlay').classList.remove('on'); focusEl(el('btnLog')); }
    else if (el('subsOverlay').classList.contains('on')){ el('subsOverlay').classList.remove('on'); focusEl(el('btnSubs')); }
    else if (el('langOverlay').classList.contains('on')){ el('langOverlay').classList.remove('on'); focusEl(el('btnLang')); }
    else focusFirst();
  }
}, false);
