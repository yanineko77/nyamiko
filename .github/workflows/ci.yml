name: ci

on: [push, pull_request]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -e
          for f in install.sh src/tunnelctl.sh hooks/55-ca-extra hooks/60-tvtunnel tools/*.sh; do
            echo "checking $f"; sh -n "$f"
          done

      - name: Node syntax
        run: node --check src/tvtunnd.js

      - name: Python syntax
        run: python3 -m py_compile src/genconfig.py src/yamlite.py

      - name: Subscription parser tests
        run: python3 tests/run_tests.py

      - name: Panel JavaScript syntax
        run: |
          python3 - <<'PY'
          import re, sys
          h = open('src/ui.html', encoding='utf-8').read()
          m = re.search(r'<script>(.*)</script>', h, re.S)
          if not m:
              sys.exit('в src/ui.html не найден блок <script>')
          open('ui-check.js', 'w', encoding='utf-8').write(m.group(1))
          print('JS панели:', len(m.group(1)), 'символов')
          PY
          node --check ui-check.js

      - name: Version strings agree
        run: |
          ui=$(sed -n 's/.*Nyamiko v\([0-9][0-9.]*\).*/\1/p' src/ui.html | head -1)
          ch=$(sed -n 's/^## \([0-9][0-9.]*\)$/\1/p' CHANGELOG.md | head -1)
          echo "панель: $ui, changelog: $ch"
          [ "$ui" = "$ch" ] || { echo "версия в панели и в CHANGELOG разошлись"; exit 1; }

      - name: No subscription secrets committed
        run: |
          if grep -rInE 'https?://[^ "'"'"']+/sub/[A-Za-z0-9_-]{16,}' --exclude-dir=.git . ; then
            echo "Похоже, в репозиторий попала ссылка подписки"; exit 1
          fi
          if grep -rIn -E 'x-hwid:[[:space:]]*[0-9a-fA-F]{8,}' --exclude-dir=.git . ; then
            echo "Похоже, в репозиторий попал HWID"; exit 1
          fi
          if grep -rIn -E '192\.168\.[0-9]{1,3}\.[0-9]{1,3}' --exclude-dir=.git src ui.html docs README.md README.ru.md INSTALL.md 2>/dev/null | grep -v '192\.168\.1\.1'; then
            echo "В репозиторий попал домашний адрес: в документации и примерах должен быть <ip-телевизора>"; exit 1
          fi
          echo "секретов не найдено"
